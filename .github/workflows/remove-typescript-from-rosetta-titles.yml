name: Remove TypeScript suffix from Rosetta titles

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-typescript-from-rosetta-titles.yml

permissions:
  contents: write

jobs:
  update-rosetta-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove trailing colon TypeScript from Rosetta titles
        run: |
          python3 - <<'PY'
          import re
          import sqlite3

          db = 'data/sandbox.db'
          conn = sqlite3.connect(db)
          conn.row_factory = sqlite3.Row

          rosettas = conn.execute(
              "SELECT id, title FROM records WHERE type = 'rosetta-stone'"
          ).fetchall()
          record_ids = [r['id'] for r in rosettas]

          record_updates = 0
          node_updates = 0
          preview_updates = 0

          def clean_title(value):
              if not value:
                  return value
              return re.sub(r'\s*:\s*TypeScript\s*$', '', value, flags=re.IGNORECASE)

          for row in rosettas:
              cleaned = clean_title(row['title'])
              if cleaned != row['title']:
                  conn.execute(
                      'UPDATE records SET title = ? WHERE id = ?',
                      (cleaned, row['id'])
                  )
                  record_updates += 1
                  print(f"RECORD: {row['title']} -> {cleaned}")

          if record_ids:
              placeholders = ','.join('?' for _ in record_ids)
              nodes = conn.execute(
                  f"SELECT id, type, title, content FROM content_nodes WHERE record_id IN ({placeholders})",
                  record_ids,
              ).fetchall()

              for node in nodes:
                  cleaned_node_title = clean_title(node['title'])
                  if cleaned_node_title != node['title']:
                      conn.execute(
                          'UPDATE content_nodes SET title = ? WHERE id = ?',
                          (cleaned_node_title, node['id'])
                      )
                      node_updates += 1
                      print(f"NODE TITLE: {node['title']} -> {cleaned_node_title}")

                  # Keep the visible placeholder title/aria label consistent, but only in Display/Preview placeholders.
                  if (node['type'] or '').lower() in ('display', 'preview') and node['content'] and 'preview-placeholder' in node['content']:
                      cleaned_content = re.sub(r'\s*:\s*TypeScript(?=\s+preview not yet available)', '', node['content'], flags=re.IGNORECASE)
                      cleaned_content = re.sub(r'(?<=preview-placeholder-title">)([^<]*?)\s*:\s*TypeScript(?=</strong>)', r'\1', cleaned_content, flags=re.IGNORECASE)
                      if cleaned_content != node['content']:
                          conn.execute(
                              'UPDATE content_nodes SET content = ? WHERE id = ?',
                              (cleaned_content, node['id'])
                          )
                          preview_updates += 1

          conn.commit()

          remaining_records = conn.execute(
              "SELECT COUNT(*) FROM records WHERE type='rosetta-stone' AND title LIKE '%: TypeScript'"
          ).fetchone()[0]
          remaining_nodes = conn.execute(
              """
              SELECT COUNT(*)
              FROM content_nodes cn
              JOIN records r ON r.id = cn.record_id
              WHERE r.type='rosetta-stone' AND cn.title LIKE '%: TypeScript'
              """
          ).fetchone()[0]

          conn.close()

          if remaining_records or remaining_nodes:
              raise SystemExit(f'Verification failed: {remaining_records} record titles and {remaining_nodes} node titles still end in : TypeScript')

          print(f'Updated {record_updates} Rosetta record titles.')
          print(f'Updated {node_updates} Rosetta node titles.')
          print(f'Updated {preview_updates} Rosetta placeholder previews for title consistency.')
          print('Subtitles, slugs, descriptions, technology children, and non-Rosetta records were not changed.')
          PY

      - name: Commit updated database
        run: |
          if git diff --quiet -- data/sandbox.db; then
            echo "No database changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sandbox.db
          git commit -m "Remove TypeScript suffix from Rosetta titles"
          git push
