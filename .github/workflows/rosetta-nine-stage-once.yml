name: Rosetta nine-stage source patch

on:
  push:
    branches:
      - work/rosetta-nine-stage-map
    paths:
      - .github/workflows/rosetta-nine-stage-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/rosetta-nine-stage-map

      - name: Update Rosetta generator
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/generator/generate.ts'); s=p.read_text(); old='  return parent ? childrenOf(nodes, parent.id) : [];'; new='  return parent\\n    ? childrenOf(nodes, parent.id).filter((stage) =>\\n        ROSETTA_STAGE_STATUS_CLASSES.some((className) =>\\n          nodeHasClassName(stage, className),\\n        ),\\n      )\\n    : [];'; assert old in s, 'Rosetta stage collector not found'; p.write_text(s.replace(old,new,1))"
          python -c "from pathlib import Path; p=Path('src/generator/generate.ts'); s=p.read_text(); assert 'if (stages.length > 6)' in s, 'Rosetta six-stage limit not found'; s=s.replace('if (stages.length > 6)','if (stages.length > 9)',1); s=s.replace('Rosetta maps support up to six stages so the route remains readable across desktop and landscape mobile.','Rosetta maps support up to nine stages so the route remains readable across desktop and landscape mobile.',1); p.write_text(s)"

      - name: Extend Rosetta snake route to nine stages
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('assets/inner.css'); s=p.read_text(); marker='.rs-stage-2::before,\\n.rs-stage-3::before,\\n.rs-stage-4::before,\\n.rs-stage-5::before,\\n.rs-stage-6::before {'; insert='.rs-stage-7 {\\n  grid-column: 1;\\n  grid-row: 3;\\n}\\n\\n.rs-stage-8 {\\n  grid-column: 2;\\n  grid-row: 3;\\n}\\n\\n.rs-stage-9 {\\n  grid-column: 3;\\n  grid-row: 3;\\n}\\n\\n.rs-stage-2::before,\\n.rs-stage-3::before,\\n.rs-stage-4::before,\\n.rs-stage-5::before,\\n.rs-stage-6::before,\\n.rs-stage-7::before,\\n.rs-stage-8::before,\\n.rs-stage-9::before {'; assert marker in s, 'Rosetta connector selector not found'; p.write_text(s.replace(marker,insert,1))"
          python -c "from pathlib import Path; p=Path('assets/inner.css'); s=p.read_text(); old='.rs-stage-4::before {'; new='.rs-stage-4::before,\\n.rs-stage-7::before {'; assert old in s, 'Rosetta vertical connector not found'; p.write_text(s.replace(old,new,1))"
          python -c "from pathlib import Path; p=Path('assets/inner.css'); s=p.read_text(); marker='\\n.rs-stage-topline {'; insert='\\n.rs-stage-8::before,\\n.rs-stage-9::before {\\n  top: 50%;\\n  right: 100%;\\n  width: var(--rs-route-gap-x);\\n  height: 2px;\\n  background: linear-gradient(90deg, rgba(95, 200, 255, 0.62), var(--rs-state));\\n  box-shadow:\\n    0 0 5px color-mix(in srgb, var(--rs-state) 52%, transparent),\\n    0 0 12px rgba(95, 200, 255, 0.18);\\n}\\n\\n.rs-stage-topline {'; assert marker in s, 'Rosetta stage topline marker not found'; p.write_text(s.replace(marker,insert,1))"

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "Susan Delgado"
          git config user.email "susanndelgado@gmail.com"
          git add src/generator/generate.ts assets/inner.css
          git commit -m "Support up to nine Rosetta stages"
          git push origin HEAD:work/rosetta-nine-stage-map
