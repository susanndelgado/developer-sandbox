name: Shared mini mark and Rosetta content cleanup

on:
  push:
    branches:
      - work/reuse-mini-mark-rosetta-content
    paths:
      - .github/workflows/reuse-mini-mark-rosetta-content-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reuse-mini-mark-rosetta-content

      - name: Update generator markup
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/generator/generate.ts'); s=p.read_text(); s=s.replace('plainText(stage.nav_label || stage.title || stage.subtitle) ||','plainText(stage.title || stage.nav_label) ||',1); s=s.replace('const detail = plainText(stage.subtitle || stage.description || \"\");','const detail = plainText(stage.content || \"\");',1); s=s.replace('<span class=\"guide-mark\">','<span class=\"mini-mark\">',1); s=s.replace('<span class=\"rosetta-project-mark\" aria-hidden=\"true\">','<span class=\"mini-mark\" aria-hidden=\"true\">',1); p.write_text(s)"

      - name: Remove duplicate mark styles
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('assets/inner.css'); s=p.read_text(); s=s.replace('  grid-template-columns: 44px minmax(0, 1fr) auto;','  grid-template-columns: auto minmax(0, 1fr) auto;',1); old='''\n.guide-mark {\n  display: grid;\n  place-items: center;\n  width: 40px;\n  height: 40px;\n  border: 1px solid rgba(103, 211, 255, 0.28);\n  border-radius: 10px;\n  color: var(--cyan);\n  background: rgba(21, 59, 103, 0.32);\n  font-size: 0.62rem;\n  font-weight: 600;\n}\n'''; assert old in s, 'guide-mark block not found'; s=s.replace(old,'\n',1); old2='''.rosetta-project-mark {\n  display: grid;\n  place-items: center;\n  width: 46px;\n  height: 46px;\n  border: 1px solid color-mix(in srgb, var(--rs-project-accent) 52%, transparent);\n  border-radius: 12px;\n  color: var(--rs-project-accent);\n  background: radial-gradient(\n    circle,\n    color-mix(in srgb, var(--rs-project-accent) 18%, transparent),\n    rgba(4, 16, 37, 0.92) 72%\n  );\n  box-shadow:\n    inset 0 0 12px color-mix(in srgb, var(--rs-project-accent) 12%, transparent),\n    0 0 12px color-mix(in srgb, var(--rs-project-accent) 24%, transparent);\n  font-family: \"Cormorant Garamond\", serif;\n  font-size: 0.92rem;\n  font-weight: 600;\n  letter-spacing: 0.04em;\n}\n'''; assert old2 in s, 'rosetta-project-mark block not found'; s=s.replace(old2,'',1); marker='''.rosetta-project-toggle:focus-visible {\n  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--rs-project-accent) 58%, transparent);\n}\n'''; assert marker in s, 'Rosetta toggle focus block not found'; replacement=marker+'\n.rosetta-project-toggle .mini-mark {\n  color: var(--rs-project-accent);\n}\n'; s=s.replace(marker,replacement,1); p.write_text(s)"

      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name "Susan Delgado"
          git config user.email "susanndelgado@gmail.com"
          git add src/generator/generate.ts assets/inner.css
          git commit -m "Reuse mini mark and show Rosetta child content"
          git push origin HEAD:work/reuse-mini-mark-rosetta-content
