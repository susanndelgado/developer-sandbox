name: Refresh home featured slider

on:
  push:
    paths:
      - .github/workflows/refresh-home-featured.yml

permissions:
  contents: write

jobs:
  refresh-home:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build generator
        run: npm run build

      - name: Regenerate root pages from the Sandbox database
        run: node --enable-source-maps dist/generator/generate.js --roots

      - name: Commit refreshed homepage only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Homepage already up to date."
          else
            git commit -m "Regenerate home featured slider"
            git push
          fi
