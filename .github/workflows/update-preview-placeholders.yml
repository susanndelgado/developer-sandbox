name: Update preview placeholders

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-preview-placeholders.yml

permissions:
  contents: write

jobs:
  update-preview-content:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update Display/Preview nodes without images in SQLite
        run: |
          python3 - <<'PY'
          import html
          import sqlite3

          db_path = "data/sandbox.db"
          labels = {
              "rosetta-stone": "Rosetta Stone",
              "lab-exploration": "LAB",
              "general-project": "Project",
          }

          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row

          rows = conn.execute(
              """
              SELECT
                  cn.id AS node_id,
                  cn.record_id,
                  cn.type AS node_type,
                  r.title,
                  r.type AS record_type
              FROM content_nodes AS cn
              JOIN records AS r ON r.id = cn.record_id
              WHERE lower(cn.type) IN ('display', 'preview')
                AND r.type IN ('rosetta-stone', 'lab-exploration', 'general-project')
                AND lower(COALESCE(cn.content, '')) NOT LIKE '%<img%'
              ORDER BY r.type, r.title, cn.id
              """
          ).fetchall()

          print(f"Found {len(rows)} Display/Preview nodes without images to update.")

          for row in rows:
              type_label = labels[row["record_type"]]
              title = html.escape(row["title"] or "", quote=False)
              content = (
                  '<span class="preview-placeholder-mark" aria-hidden="true">TS</span>\n'
                  f'  <span class="preview-placeholder-type">{type_label}</span>\n'
                  f'  <strong class="preview-placeholder-title">{title}</strong>\n'
                  '  <span class="preview-placeholder-note">Preview coming soon</span>'
              )

              conn.execute(
                  "UPDATE content_nodes SET content = ? WHERE id = ?",
                  (content, row["node_id"]),
              )

              print(
                  f'Updated {row["node_id"]}: {row["record_type"]} | {row["title"]}'
              )

          conn.commit()

          remaining = conn.execute(
              """
              SELECT COUNT(*)
              FROM content_nodes AS cn
              JOIN records AS r ON r.id = cn.record_id
              WHERE lower(cn.type) IN ('display', 'preview')
                AND r.type IN ('rosetta-stone', 'lab-exploration', 'general-project')
                AND lower(COALESCE(cn.content, '')) NOT LIKE '%<img%'
                AND content NOT LIKE '%preview-placeholder-note%Preview coming soon%'
              """
          ).fetchone()[0]

          conn.close()

          if remaining:
              raise SystemExit(f"Verification failed: {remaining} matching nodes were not updated.")

          print("Verification passed.")
          PY

      - name: Commit updated database
        run: |
          if git diff --quiet -- data/sandbox.db; then
            echo "No database changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sandbox.db
          git commit -m "Update preview placeholder content"
          git push
