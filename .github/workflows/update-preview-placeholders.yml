name: Update preview placeholders

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-preview-placeholders.yml

permissions:
  contents: write

jobs:
  update-preview-content:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve image previews and update only image-free previews
        run: |
          git show d14262a3401e026137c234a582377c71f92feb91:data/sandbox.db > /tmp/original-sandbox.db

          python3 - <<'PY'
          import html
          import sqlite3

          current_path = "data/sandbox.db"
          original_path = "/tmp/original-sandbox.db"
          labels = {
              "rosetta-stone": "Rosetta Stone",
              "lab-exploration": "LAB",
              "general-project": "Project",
          }

          current = sqlite3.connect(current_path)
          original = sqlite3.connect(original_path)
          current.row_factory = sqlite3.Row
          original.row_factory = sqlite3.Row

          rows = original.execute(
              """
              SELECT
                  cn.id AS node_id,
                  cn.content AS original_content,
                  r.title,
                  r.type AS record_type
              FROM content_nodes AS cn
              JOIN records AS r ON r.id = cn.record_id
              WHERE lower(cn.type) IN ('display', 'preview')
                AND r.type IN ('rosetta-stone', 'lab-exploration', 'general-project')
              ORDER BY r.type, r.title, cn.id
              """
          ).fetchall()

          restored = 0
          placeholders = 0

          for row in rows:
              original_content = row["original_content"] or ""

              if "<img" in original_content.lower():
                  new_content = row["original_content"]
                  restored += 1
              else:
                  type_label = labels[row["record_type"]]
                  title = html.escape(row["title"] or "", quote=False)
                  new_content = (
                      '<span class="preview-placeholder-mark" aria-hidden="true">TS</span>\n'
                      f'  <span class="preview-placeholder-type">{type_label}</span>\n'
                      f'  <strong class="preview-placeholder-title">{title}</strong>\n'
                      '  <span class="preview-placeholder-note">Preview coming soon</span>'
                  )
                  placeholders += 1

              current.execute(
                  "UPDATE content_nodes SET content = ? WHERE id = ?",
                  (new_content, row["node_id"]),
              )

          current.commit()

          print(f"Restored {restored} Display/Preview nodes that already had images.")
          print(f"Added placeholders to {placeholders} Display/Preview nodes that had no images.")

          for row in rows:
              now = current.execute(
                  "SELECT content FROM content_nodes WHERE id = ?",
                  (row["node_id"],),
              ).fetchone()
              content = (now[0] if now else "") or ""
              original_content = row["original_content"] or ""

              if "<img" in original_content.lower():
                  if content != original_content:
                      raise SystemExit(f'Image preview was not preserved for {row["node_id"]}.')
              else:
                  if "preview-placeholder-note" not in content or "Preview coming soon" not in content:
                      raise SystemExit(f'Placeholder was not applied to {row["node_id"]}.')

          current.close()
          original.close()
          print("Verification passed.")
          PY

      - name: Commit corrected database
        run: |
          if git diff --quiet -- data/sandbox.db; then
            echo "No database changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sandbox.db
          git commit -m "Preserve image previews and add missing placeholders"
          git push
