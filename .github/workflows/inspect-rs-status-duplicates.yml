name: Inspect Rosetta technology duplicates

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-rs-status-duplicates.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect rs-status technology children
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          conn = sqlite3.connect('data/sandbox.db')
          conn.row_factory = sqlite3.Row
          out = []

          records = conn.execute("SELECT id,title FROM records WHERE type='rosetta-stone' ORDER BY title").fetchall()
          for rec in records:
              status = conn.execute("""
                SELECT id,title,class_name,sort_order
                FROM content_nodes
                WHERE record_id=?
                  AND instr(lower(' ' || coalesce(class_name,'') || ' '), ' rs-status ') > 0
                ORDER BY coalesce(sort_order,999999), id
                LIMIT 1
              """, (rec['id'],)).fetchone()
              if not status:
                  continue
              children = conn.execute("""
                SELECT id,title,subtitle,description,content,sort_order,class_name,metadata
                FROM content_nodes
                WHERE parent_id=?
                ORDER BY coalesce(sort_order,999999), id
              """, (status['id'],)).fetchall()
              out.append(f"RECORD|{rec['id']}|{rec['title']}|STATUS={status['id']}")
              for c in children:
                  text_len = sum(len(str(c[k] or '')) for k in ('title','subtitle','description','content','metadata'))
                  out.append(f"  CHILD|{c['id']}|order={c['sort_order']}|class={c['class_name']}|len={text_len}|title={c['title']}")
              out.append('')

          conn.close()
          Path('tmp-rs-status-report.txt').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-rs-status-report.txt
          git commit -m "Add temporary Rosetta technology duplicate report"
          git push
