name: Update image-free preview content

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-image-free-preview-content.yml

permissions:
  contents: write

jobs:
  update-preview-content:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace only image-free Display/Preview content
        run: |
          python3 - <<'PY'
          import html
          import sqlite3

          db_path = "data/sandbox.db"

          classification_labels = {
              "rosetta-stone": "Rosetta Stone",
              "lab-exploration": "LAB",
              "general-project": "Project",
          }

          image_markers = (
              "<img",
              "<picture",
              "<svg",
              "background-image",
              "url(",
          )

          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row

          rows = conn.execute(
              """
              SELECT
                  cn.id AS node_id,
                  cn.record_id,
                  cn.type AS node_type,
                  cn.content,
                  r.title,
                  r.type AS record_type
              FROM content_nodes AS cn
              JOIN records AS r ON r.id = cn.record_id
              WHERE lower(cn.type) IN ('display', 'preview')
                AND r.type IN ('rosetta-stone', 'lab-exploration', 'general-project')
              ORDER BY r.type, r.title, cn.id
              """
          ).fetchall()

          updated = 0
          preserved = 0

          for row in rows:
              existing = (row["content"] or "").lower()

              if any(marker in existing for marker in image_markers):
                  preserved += 1
                  print(f'PRESERVED IMAGE: {row["record_type"]} | {row["title"]} | {row["node_id"]}')
                  continue

              classification = classification_labels[row["record_type"]]
              title = html.escape(row["title"] or "", quote=False)

              content = (
                  '<span class="preview-placeholder-mark" aria-hidden="true">TS</span>\n'
                  f'  <span class="preview-placeholder-type">{classification}</span>\n'
                  f'  <strong class="preview-placeholder-title">{title}</strong>\n'
                  '  <span class="preview-placeholder-note">Preview coming soon</span>'
              )

              conn.execute(
                  "UPDATE content_nodes SET content = ? WHERE id = ?",
                  (content, row["node_id"]),
              )
              updated += 1
              print(f'UPDATED: {classification} | {row["title"]} | {row["node_id"]}')

          conn.commit()

          # Verify reference guides/documentation were never targeted and image previews remain untouched.
          bad_reference_changes = conn.execute(
              """
              SELECT COUNT(*)
              FROM content_nodes AS cn
              JOIN records AS r ON r.id = cn.record_id
              WHERE lower(cn.type) IN ('display', 'preview')
                AND r.type NOT IN ('rosetta-stone', 'lab-exploration', 'general-project')
                AND cn.content LIKE '%preview-placeholder-note%Preview coming soon%'
              """
          ).fetchone()[0]

          if bad_reference_changes:
              raise SystemExit(
                  f"Verification failed: {bad_reference_changes} non-project/reference-style previews contain the placeholder."
              )

          conn.close()

          print(f"Updated {updated} image-free preview nodes.")
          print(f"Preserved {preserved} preview nodes that already contain images.")
          print("Reference guides/documentation were excluded by classification.")
          PY

      - name: Commit updated database
        run: |
          if git diff --quiet -- data/sandbox.db; then
            echo "No database changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sandbox.db
          git commit -m "Replace image-free preview content with placeholders"
          git push
