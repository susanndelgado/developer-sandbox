name: Mark Modern Agenda completed technologies

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mark-modern-agenda-complete.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark completed Modern Agenda technologies
        run: |
          python3 - <<'PY'
          import re
          import sqlite3

          db_path = 'data/sandbox.db'
          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row

          status = conn.execute("""
              SELECT id
              FROM content_nodes
              WHERE record_id='modern-agenda'
                AND instr(lower(' ' || coalesce(class_name,'') || ' '), ' rs-status ') > 0
              ORDER BY coalesce(sort_order,999999), id
              LIMIT 1
          """).fetchone()

          if status is None:
              raise SystemExit('Modern Agenda rs-status node not found.')

          children = conn.execute("""
              SELECT id, title, class_name, sort_order, content, description, subtitle, metadata
              FROM content_nodes
              WHERE parent_id=?
              ORDER BY coalesce(sort_order,999999), id
          """, (status['id'],)).fetchall()

          def family(title):
              t = str(title or '').strip().lower()
              if 'javascript' in t or 'ecmascript' in t:
                  return 'javascript'
              if re.search(r'\btypescript\b', t):
                  return 'typescript'
              if re.search(r'\bangular\b', t):
                  return 'angular'
              if re.search(r'\bphp\b', t):
                  return 'php'
              return None

          targets = {'javascript', 'typescript', 'angular', 'php'}
          found = {}

          for row in children:
              fam = family(row['title'])
              if fam in targets:
                  if fam in found:
                      raise SystemExit(f'Duplicate Modern Agenda technology family remains for {fam}: {found[fam][1]!r} and {row["title"]!r}')
                  found[fam] = (row['id'], row['title'])

          missing = targets - set(found)
          if missing:
              raise SystemExit(f'Missing Modern Agenda technology entries: {sorted(missing)}')

          # Snapshot every field except class_name so we can prove nothing else changes.
          before = {
              row['id']: tuple(row[k] for k in ('title','sort_order','content','description','subtitle','metadata'))
              for row in children
          }
          all_classes_before = {row['id']: row['class_name'] for row in children}

          for fam in ('javascript', 'typescript', 'angular', 'php'):
              node_id, title = found[fam]
              conn.execute(
                  "UPDATE content_nodes SET class_name='rs-complete' WHERE id=?",
                  (node_id,),
              )
              print(f'MARKED COMPLETE: {title} ({node_id})')

          conn.commit()

          after_rows = conn.execute("""
              SELECT id, title, class_name, sort_order, content, description, subtitle, metadata
              FROM content_nodes
              WHERE parent_id=?
              ORDER BY coalesce(sort_order,999999), id
          """, (status['id'],)).fetchall()

          after = {
              row['id']: tuple(row[k] for k in ('title','sort_order','content','description','subtitle','metadata'))
              for row in after_rows
          }
          if after != before:
              raise SystemExit('Verification failed: a Modern Agenda technology field other than class_name changed.')

          target_ids = {node_id for node_id, _ in found.values()}
          for row in after_rows:
              if row['id'] in target_ids:
                  if row['class_name'] != 'rs-complete':
                      raise SystemExit(f'Verification failed: {row["title"]} is not rs-complete.')
              else:
                  if row['class_name'] != all_classes_before[row['id']]:
                      raise SystemExit(f'Verification failed: non-target class changed for {row["title"]}.')

          conn.close()
          print('Only JavaScript / modern ECMAScript, TypeScript, Angular, and PHP were changed to rs-complete.')
          PY

      - name: Commit updated database
        run: |
          if git diff --quiet -- data/sandbox.db; then
            echo "No database changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sandbox.db
          git commit -m "Mark completed Modern Agenda technologies"
          git push
