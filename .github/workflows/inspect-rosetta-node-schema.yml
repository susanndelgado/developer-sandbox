name: Add Rosetta technologies status nodes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-rosetta-node-schema.yml

permissions:
  contents: write

jobs:
  update-rosetta-technologies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add or complete Technologies grids for Rosetta Stones
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import sqlite3

          DB = 'data/sandbox.db'
          DESIRED = [
              ('JavaScript / modern ECMAScript', 10, 'javascript-modern-ecmascript'),
              ('TypeScript', 20, 'typescript'),
              ('Angular', 30, 'angular'),
              ('Python', 40, 'python'),
              ('Java', 50, 'java'),
              ('C#', 60, 'csharp'),
              ('PHP', 70, 'php'),
          ]

          DEFAULT_METADATA = json.dumps({
              'mode': 'default',
              'additionalHtml': '',
              'category': '',
              'url': '',
              'code': '',
              'semanticAssist': {
                  'details': True,
                  'content': True,
                  'additional': True,
                  'generated': True,
              },
          }, separators=(',', ':'))

          conn = sqlite3.connect(DB)
          conn.row_factory = sqlite3.Row
          conn.execute('PRAGMA foreign_keys = ON')

          # Guardrail: fingerprint all non-Rosetta content nodes so this update cannot
          # silently alter other project types, reference guides, or documentation.
          def fingerprint_non_rosetta():
              rows = conn.execute('''
                  SELECT cn.*
                  FROM content_nodes AS cn
                  JOIN records AS r ON r.id = cn.record_id
                  WHERE r.type <> 'rosetta-stone' OR r.type IS NULL
                  ORDER BY cn.id
              ''').fetchall()
              payload = '\n'.join(repr(tuple(row)) for row in rows)
              return hashlib.sha256(payload.encode('utf-8')).hexdigest()

          before_non_rosetta = fingerprint_non_rosetta()

          def normalize(text):
              return ' '.join((text or '').split()).casefold()

          def class_tokens(value):
              return [token for token in (value or '').split() if token]

          def ensure_class(value, required):
              tokens = class_tokens(value)
              if required not in tokens:
                  tokens.append(required)
              return ' '.join(tokens)

          def id_exists(node_id):
              return conn.execute(
                  'SELECT 1 FROM content_nodes WHERE id = ?', (node_id,)
              ).fetchone() is not None

          def make_id(prefix, record_id, suffix=''):
              digest = hashlib.sha1(f'{record_id}|{suffix}'.encode('utf-8')).hexdigest()[:12]
              candidate = f'{prefix}-{digest}'
              n = 2
              while id_exists(candidate):
                  candidate = f'{prefix}-{digest}-{n}'
                  n += 1
              return candidate

          records = conn.execute('''
              SELECT id, title
              FROM records
              WHERE type = 'rosetta-stone'
              ORDER BY title, id
          ''').fetchall()

          created_parents = 0
          updated_parents = 0
          created_children = 0
          normalized_children = 0

          for record in records:
              record_id = record['id']
              record_title = record['title']

              # Prefer an existing top-level Technologies grid/box. If a Technologies
              # node already exists but is another type, reuse it and normalize it to grid.
              technology_nodes = conn.execute('''
                  SELECT *
                  FROM content_nodes
                  WHERE record_id = ?
                    AND parent_id IS NULL
                    AND lower(trim(title)) = 'technologies'
                  ORDER BY
                    CASE WHEN lower(type) IN ('grid', 'box') THEN 0 ELSE 1 END,
                    CASE WHEN instr(' ' || lower(coalesce(class_name, '')) || ' ', ' rs-status ') > 0 THEN 0 ELSE 1 END,
                    sort_order,
                    rowid
              ''', (record_id,)).fetchall()

              if technology_nodes:
                  tech = technology_nodes[0]
                  tech_id = tech['id']
                  new_class = ensure_class(tech['class_name'], 'rs-status')
                  needs_update = (
                      (tech['type'] or '').lower() not in ('grid', 'box')
                      or tech['title'] != 'Technologies'
                      or new_class != (tech['class_name'] or '')
                  )
                  if needs_update:
                      conn.execute('''
                          UPDATE content_nodes
                          SET type = 'grid', title = 'Technologies', class_name = ?
                          WHERE id = ?
                      ''', (new_class, tech_id))
                      updated_parents += 1
              else:
                  tech_id = make_id('node-rosetta-technologies', record_id, 'technologies')
                  conn.execute('''
                      INSERT INTO content_nodes (
                          id, record_id, type, parent_id, title, subtitle,
                          description, nav_label, content, sort_order,
                          featured, hidden, class_name, metadata
                      ) VALUES (?, ?, 'grid', NULL, 'Technologies', NULL,
                                NULL, NULL, NULL, 30, 0, 0, 'rs-status', ?)
                  ''', (tech_id, record_id, DEFAULT_METADATA))
                  created_parents += 1

              children = conn.execute('''
                  SELECT *
                  FROM content_nodes
                  WHERE record_id = ? AND parent_id = ?
                  ORDER BY sort_order, rowid
              ''', (record_id, tech_id)).fetchall()

              by_title = {}
              for child in children:
                  by_title.setdefault(normalize(child['title']), []).append(child)

              for desired_title, desired_order, suffix in DESIRED:
                  matches = by_title.get(normalize(desired_title), [])
                  if matches:
                      child = matches[0]
                      # These seven requested technology-status children use rs-planned.
                      if (child['class_name'] or '') != 'rs-planned' or child['title'] != desired_title or child['sort_order'] != desired_order:
                          conn.execute('''
                              UPDATE content_nodes
                              SET title = ?, class_name = 'rs-planned', sort_order = ?
                              WHERE id = ?
                          ''', (desired_title, desired_order, child['id']))
                          normalized_children += 1
                  else:
                      child_id = make_id('child-rosetta-technology', record_id, suffix)
                      conn.execute('''
                          INSERT INTO content_nodes (
                              id, record_id, type, parent_id, title, subtitle,
                              description, nav_label, content, sort_order,
                              featured, hidden, class_name, metadata
                          ) VALUES (?, ?, 'standard', ?, ?, NULL,
                                    NULL, NULL, NULL, ?, 0, 0, 'rs-planned', ?)
                      ''', (
                          child_id, record_id, tech_id, desired_title,
                          desired_order, DEFAULT_METADATA,
                      ))
                      created_children += 1

              print(f'OK: {record_title} | Technologies node {tech_id}')

          conn.commit()

          # Verification: every Rosetta Stone must now have a top-level Technologies
          # grid/box with rs-status and all seven requested children as rs-planned.
          problems = []
          for record in records:
              tech = conn.execute('''
                  SELECT * FROM content_nodes
                  WHERE record_id = ?
                    AND parent_id IS NULL
                    AND lower(trim(title)) = 'technologies'
                    AND lower(type) IN ('grid', 'box')
                    AND instr(' ' || lower(coalesce(class_name, '')) || ' ', ' rs-status ') > 0
                  ORDER BY rowid
                  LIMIT 1
              ''', (record['id'],)).fetchone()

              if tech is None:
                  problems.append(f"{record['title']}: missing Technologies grid/box with rs-status")
                  continue

              for desired_title, desired_order, _ in DESIRED:
                  child = conn.execute('''
                      SELECT * FROM content_nodes
                      WHERE record_id = ? AND parent_id = ?
                        AND lower(trim(title)) = lower(?)
                      ORDER BY rowid
                      LIMIT 1
                  ''', (record['id'], tech['id'], desired_title)).fetchone()

                  if child is None:
                      problems.append(f"{record['title']}: missing child {desired_title}")
                  elif (child['class_name'] or '') != 'rs-planned':
                      problems.append(f"{record['title']}: {desired_title} class is {child['class_name']!r}")

          after_non_rosetta = fingerprint_non_rosetta()
          if before_non_rosetta != after_non_rosetta:
              problems.append('Non-Rosetta content nodes changed unexpectedly.')

          if problems:
              conn.close()
              raise SystemExit('Verification failed:\n' + '\n'.join(problems))

          total = len(records)
          conn.close()

          print(f'Verified {total} Rosetta Stone records.')
          print(f'Created Technologies nodes: {created_parents}')
          print(f'Updated existing Technologies nodes: {updated_parents}')
          print(f'Created missing technology children: {created_children}')
          print(f'Normalized existing requested children: {normalized_children}')
          print('No non-Rosetta content nodes were changed.')
          PY

      - name: Commit updated database
        run: |
          if git diff --quiet -- data/sandbox.db; then
            echo "No database changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sandbox.db
          git commit -m "Add Technologies status grids to Rosetta Stones"
          git push
