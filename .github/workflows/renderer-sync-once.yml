name: Renderer Sync Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/renderer-sync-once.yml
      - scripts/renderer-sync-once.py

permissions:
  contents: write

jobs:
  sync-renderers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply renderer synchronization
        run: python3 scripts/renderer-sync-once.py

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Commit renderer corrections
        run: |
          rm .github/workflows/renderer-sync-once.yml
          rm scripts/renderer-sync-once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/local-editor/client.ts src/generator/generate.ts .github/workflows/renderer-sync-once.yml scripts/renderer-sync-once.py
          git commit -m "Synchronize editor and generator renderers"
          git push origin HEAD:main
