name: Renderer Sync Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/renderer-sync-once.yml

permissions:
  contents: write

jobs:
  sync-renderers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Synchronize editor preview and generator renderers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          def replace_count(text: str, old: str, new: str, expected: int, label: str) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} matches, found {count}")
              return text.replace(old, new)

          def replace_section(text: str, start_marker: str, end_marker: str, replacement: str, label: str) -> str:
              try:
                  start = text.index(start_marker)
                  end = text.index(end_marker, start)
              except ValueError as exc:
                  raise SystemExit(f"{label}: section marker not found") from exc
              return text[:start] + replacement.rstrip() + "\n\n" + text[end:]

          # ---------------------------------------------------------
          # Editor preview: parent nodes keep their own Details/Content
          # across Grid, Code, Standard, and Split renderers.
          # Split already had parentBody() in the latest pushed file.
          # ---------------------------------------------------------
          client_path = Path("src/local-editor/client.ts")
          client = client_path.read_text(encoding="utf8")

          client = replace_once(
              client,
              '  ${parentHeader(parent)}\n  <div class="project-meta">',
              '  ${parentHeader(parent)}\n  ${parentBody(parent)}\n  <div class="project-meta">',
              "client grid parent body",
          )

          client = replace_count(
              client,
              '  ${parentHeader(parent)}\n  <div class="project-command-list">',
              '  ${parentHeader(parent)}\n  ${parentBody(parent)}\n  <div class="project-command-list">',
              2,
              "client code/standard parent body",
          )

          client_path.write_text(client, encoding="utf8")

          # ---------------------------------------------------------
          # Generator: make node rendering mirror the working editor preview.
          # No CSS, template HTML, or generated HTML file is edited here.
          # ---------------------------------------------------------
          generator_path = Path("src/generator/generate.ts")
          generator = generator_path.read_text(encoding="utf8")

          helper_marker = "function recordSort(a: RecordRow, b: RecordRow): number {"
          if "function parentClasses(" not in generator:
              helper_block = r'''function positionClass(prefix: "node" | "child", index: number): string {
  return `${prefix}-${String(index + 1).padStart(2, "0")}`;
}

function parentHeader(node: NodeRow, heading: "h2" | "h3" = "h3"): string {
  const subtitle = (node.subtitle ?? "").trim();
  const title = (node.title ?? "").trim();

  if (!subtitle && !title) {
    return "";
  }

  return `
<header>
  ${subtitle ? `<span>${subtitle}</span>` : ""}
  ${title ? `<${heading}>${title}</${heading}>` : ""}
</header>`;
}

function parentBody(node: NodeRow): string {
  const details = node.description ?? "";
  const content = node.content ?? "";

  return [details, content].filter(Boolean).join("\n");
}

function parentClasses(
  node: NodeRow,
  nodeIndex: number,
  requiredClass: string,
): string {
  return classes(
    requiredClass,
    positionClass("node", nodeIndex),
    `uid-${slugify(node.id)}`,
    node.class_name,
  );
}

function childClasses(
  child: NodeRow,
  childIndex: number,
  requiredClass = "",
): string {
  return classes(
    requiredClass,
    positionClass("child", childIndex),
    `uid-${slugify(child.id)}`,
    child.class_name,
  );
}

function uniquePanelId(
  record: RecordRow,
  parent: NodeRow,
  child: NodeRow,
): string {
  return `panel-${slugify(record.id)}-${slugify(parent.id)}-${slugify(child.id)}`;
}

'''
              generator = replace_once(
                  generator,
                  helper_marker,
                  helper_block + helper_marker,
                  "generator shared render helpers",
              )

          old_normalized = r'''function normalizedNodeType(node: NodeRow): string {
  const type = String(node.type || "standard").toLowerCase();

  /*
   * Compatibility with older node values.
   */
  if (type === "documentation") {
    return "standard";
  }

  if (type === "preview") {
    return "display";
  }

  return type;
}'''
          new_normalized = r'''function normalizedNodeType(node: NodeRow): string {
  const type = String(node.type || "standard").toLowerCase();

  if (type === "documentation" || type === "section") {
    return "standard";
  }

  if (type === "preview") {
    return "display";
  }

  if (type === "group") {
    return "grid";
  }

  if (["nav", "display", "standard", "split", "grid", "code"].includes(type)) {
    return type;
  }

  return "standard";
}'''
          generator = replace_once(
              generator,
              old_normalized,
              new_normalized,
              "generator normalized node type",
          )

          old_hierarchy = r'''function topNodes(nodes: NodeRow[]): NodeRow[] {
  return nodes
    .filter((node) => !node.parent_id && !Boolean(node.hidden))
    .sort((a, b) => Number(a.sort_order ?? 0) - Number(b.sort_order ?? 0));
}

function childrenOf(nodes: NodeRow[], parentId: string): NodeRow[] {
  return nodes
    .filter((node) => node.parent_id === parentId && !Boolean(node.hidden))
    .sort((a, b) => Number(a.sort_order ?? 0) - Number(b.sort_order ?? 0));
}'''
          new_hierarchy = r'''function topNodes(nodes: NodeRow[]): NodeRow[] {
  return nodes
    .filter((node) => !node.parent_id && !Boolean(node.hidden))
    .sort(
      (a, b) =>
        Number(a.sort_order ?? 999999) - Number(b.sort_order ?? 999999) ||
        a.id.localeCompare(b.id),
    );
}

function childrenOf(nodes: NodeRow[], parentId: string): NodeRow[] {
  return nodes
    .filter((node) => node.parent_id === parentId && !Boolean(node.hidden))
    .sort(
      (a, b) =>
        Number(a.sort_order ?? 999999) - Number(b.sort_order ?? 999999) ||
        a.id.localeCompare(b.id),
    );
}'''
          generator = replace_once(
              generator,
              old_hierarchy,
              new_hierarchy,
              "generator hierarchy ordering",
          )

          nav_marker = "/* =========================================================\n   NAV / LINK NODE\n   ========================================================= */"
          display_marker = "/* =========================================================\n   DISPLAY / PREVIEW NODE\n   ========================================================= */"
          standard_marker = "/* =========================================================\n   STANDARD NODE\n   ========================================================= */"
          grid_marker = "/* =========================================================\n   GRID / BOXES NODE\n   ========================================================= */"
          split_marker = "/* =========================================================\n   SPLIT NODE\n   ========================================================= */"
          code_marker = "/* =========================================================\n   CODE / EXAMPLES NODE\n   ========================================================= */"
          dispatch_marker = "/* =========================================================\n   PARENT DISPATCH\n   ========================================================= */"
          entry_content_marker = "/* =========================================================\n   ENTRY CONTENT\n   ========================================================= */"

          nav_section = r'''/* =========================================================
   NAV / LINK NODE
   ========================================================= */

function renderNavChild(
  record: RecordRow,
  parent: NodeRow,
  child: NodeRow,
  childIndex: number,
  mode: ParentMode,
): string {
  const rawUrl = metaString(child, "url") || "#";
  const url = generatedEntryLink(record, rawUrl);
  const text = child.nav_label || child.title || "";
  const id = `child-${slugify(child.id)}`;
  const base = childClasses(
    child,
    childIndex,
    mode === "buttons" ? "project-link" : "",
  );

  if (mode === "buttons") {
    return `<a
  id="${attr(id)}"
  class="${attr(base)}"
  href="${attr(url)}"${externalAttributes(url)}
>${text}<span aria-hidden="true">›</span></a>`;
  }

  return `<a
  id="${attr(id)}"
  class="${attr(base)}"
  href="${attr(url)}"${externalAttributes(url)}
>${text}</a>`;
}

function renderNav(
  record: RecordRow,
  parent: NodeRow,
  children: NodeRow[],
  nodeIndex: number,
): string {
  const mode = nodeMode(parent);
  const links = children
    .map((child, index) => renderNavChild(record, parent, child, index, mode))
    .join("\n");

  if (mode === "buttons") {
    return `<div
  id="node-${attr(slugify(parent.id))}"
  class="${attr(parentClasses(parent, nodeIndex, "project-actions"))}"
>
${links}
</div>`;
  }

  return `<nav
  id="node-${attr(slugify(parent.id))}"
  class="${attr(parentClasses(parent, nodeIndex, "project-doc-nav"))}"
  aria-label="${attr(parent.nav_label || parent.title || "Page sections")}"
>
${links}
</nav>`;
}'''
          generator = replace_section(
              generator,
              nav_marker,
              display_marker,
              nav_section,
              "generator nav renderer",
          )

          display_section = r'''/* =========================================================
   DISPLAY / PREVIEW NODE
   ========================================================= */

function renderDisplay(parent: NodeRow, nodeIndex: number): string {
  const content = parent.content ?? "";
  const details = parent.description ?? "";
  const header = parentHeader(parent, "h2");

  return `<div
  id="node-${attr(slugify(parent.id))}"
  class="${attr(parentClasses(parent, nodeIndex, "project-display"))}"
>
  <div class="project-preview">${content}</div>
  ${
    details || header
      ? `<div class="project-detail">
    ${header}
    ${details ? `<div class="project-display-details">${details}</div>` : ""}
  </div>`
      : ""
  }
</div>`;
}'''
          generator = replace_section(
              generator,
              display_marker,
              standard_marker,
              display_section,
              "generator display renderer",
          )

          standard_section = r'''/* =========================================================
   STANDARD NODE
   ========================================================= */

function renderStandardChild(
  record: RecordRow,
  parent: NodeRow,
  child: NodeRow,
  childIndex: number,
): string {
  const mode = nodeMode(parent);
  const id = `child-${slugify(child.id)}`;
  const base = childClasses(child, childIndex, "project-command");

  if (mode === "collapse-list") {
    const panelId = uniquePanelId(record, parent, child);
    const summary = `${childTitle(child)}${child.description ?? ""}`;

    return `<div id="${attr(id)}" class="${attr(classes(base, "is-collapsible"))}">
  <div class="project-command-summary">${summary}</div>
  <button
    class="project-command-action collapse-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="${attr(panelId)}"
    aria-label="Expand ${attr(child.title || "item")}"
  ><span aria-hidden="true">⌄</span></button>
  <div id="${attr(panelId)}" class="project-command-panel" hidden>
    ${child.content ?? ""}
  </div>
</div>`;
  }

  if (mode === "link-list") {
    const rawUrl = metaString(child, "url") || "#";
    const url = generatedEntryLink(record, rawUrl);

    return `<div id="${attr(id)}" class="${attr(base)}">
  <div class="project-command-content">
    ${childTitle(child)}
    ${child.content ?? ""}
  </div>
  <a
    class="project-command-action"
    href="${attr(url)}"${externalAttributes(url)}
    aria-label="${attr(child.nav_label || child.title || "Open linked item")}"
  ><span aria-hidden="true">›</span></a>
</div>`;
  }

  return `<div id="${attr(id)}" class="${attr(base)}">
  ${childTitle(child)}
  ${child.content ?? ""}
</div>`;
}

function renderStandard(
  record: RecordRow,
  parent: NodeRow,
  children: NodeRow[],
  nodeIndex: number,
): string {
  const items = children
    .map((child, index) => renderStandardChild(record, parent, child, index))
    .join("\n");

  return `<section
  id="node-${attr(slugify(parent.id))}"
  class="${attr(parentClasses(parent, nodeIndex, "project-detail"))}"
>
  ${parentHeader(parent)}
  ${parentBody(parent)}
  <div class="project-command-list">
${items}
  </div>
</section>`;
}'''
          generator = replace_section(
              generator,
              standard_marker,
              grid_marker,
              standard_section,
              "generator standard renderer",
          )

          grid_section = r'''/* =========================================================
   GRID / BOXES NODE
   ========================================================= */

function renderGridChild(child: NodeRow, childIndex: number): string {
  const id = `child-${slugify(child.id)}`;

  return `<div id="${attr(id)}" class="${attr(childClasses(child, childIndex))}">
  ${childTitle(child)}
  ${child.content ?? ""}
</div>`;
}

function renderGrid(
  parent: NodeRow,
  children: NodeRow[],
  nodeIndex: number,
): string {
  const items = children
    .map((child, index) => renderGridChild(child, index))
    .join("\n");

  return `<section
  id="node-${attr(slugify(parent.id))}"
  class="${attr(parentClasses(parent, nodeIndex, "project-detail"))}"
>
  ${parentHeader(parent)}
  ${parentBody(parent)}
  <div class="project-meta">
${items}
  </div>
</section>`;
}'''
          generator = replace_section(
              generator,
              grid_marker,
              split_marker,
              grid_section,
              "generator grid renderer",
          )

          split_section = r'''/* =========================================================
   SPLIT NODE
   ========================================================= */

function parseSplitMode(mode: string): {
  layout: "small-left" | "equal" | "small-right" | "three-column";
  behavior: "default" | "collapse" | "link";
} {
  let layout: "small-left" | "equal" | "small-right" | "three-column" =
    "small-left";

  if (mode.startsWith("half-")) {
    layout = "equal";
  }

  if (mode.startsWith("small-right-")) {
    layout = "small-right";
  }

  if (mode.startsWith("three-column-")) {
    layout = "three-column";
  }

  const behavior = mode.endsWith("-collapse")
    ? "collapse"
    : mode.endsWith("-link")
      ? "link"
      : "default";

  return { layout, behavior };
}

function renderSplitCells(
  child: NodeRow,
  layout: "small-left" | "equal" | "small-right" | "three-column",
  action = "",
): string {
  const values = [
    child.description ?? "",
    child.content ?? "",
    metaString(child, "additionalHtml"),
  ];

  const count = layout === "three-column" ? 3 : 2;

  return values
    .slice(0, count)
    .map((value, index) => {
      const isLast = index === count - 1;

      return `<div class="project-split-cell">
  ${value}
  ${isLast ? action : ""}
</div>`;
    })
    .join("\n");
}

function renderSplitChild(
  record: RecordRow,
  parent: NodeRow,
  child: NodeRow,
  childIndex: number,
  mode: ParentMode,
): string {
  const { layout, behavior } = parseSplitMode(mode);
  const id = `child-${slugify(child.id)}`;
  const base = childClasses(child, childIndex, "project-command");
  const title = child.title
    ? `<div class="project-split-child-head">${child.title}</div>`
    : "";

  if (behavior === "collapse") {
    const panelId = uniquePanelId(record, parent, child);

    return `<div id="${attr(id)}" class="${attr(classes(base, "is-collapsible"))}">
  <div class="project-command-summary">${child.title ?? ""}</div>
  <button
    class="project-command-action collapse-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="${attr(panelId)}"
    aria-label="Expand ${attr(child.title || "item")}"
  ><span aria-hidden="true">⌄</span></button>
  <div
    id="${attr(panelId)}"
    class="project-split project-split--${attr(layout)} project-command-panel"
    hidden
  >
    ${renderSplitCells(child, layout)}
  </div>
</div>`;
  }

  let action = "";

  if (behavior === "link") {
    const rawUrl = metaString(child, "url") || "#";
    const url = generatedEntryLink(record, rawUrl);

    action = `<a
  class="project-command-action"
  href="${attr(url)}"${externalAttributes(url)}
  aria-label="${attr(child.nav_label || child.title || "Open linked item")}"
><span aria-hidden="true">›</span></a>`;
  }

  return `<div id="${attr(id)}" class="${attr(base)}">
  ${title}
  <div class="project-split project-split--${attr(layout)}">
    ${renderSplitCells(child, layout, action)}
  </div>
</div>`;
}

function renderSplit(
  record: RecordRow,
  parent: NodeRow,
  children: NodeRow[],
  nodeIndex: number,
): string {
  const mode = nodeMode(parent);
  const items = children
    .map((child, index) => renderSplitChild(record, parent, child, index, mode))
    .join("\n");

  return `<section
  id="node-${attr(slugify(parent.id))}"
  class="${attr(parentClasses(parent, nodeIndex, "project-doc-section"))}"
>
  ${parentHeader(parent)}
  ${parentBody(parent)}
  <div class="project-command-list">
${items}
  </div>
</section>`;
}'''
          generator = replace_section(
              generator,
              split_marker,
              code_marker,
              split_section,
              "generator split renderer",
          )

          code_section = r'''/* =========================================================
   CODE / EXAMPLES NODE
   ========================================================= */

function renderCodeExample(child: NodeRow): string {
  const code = metaString(child, "code");

  return `<div class="project-example">
  <small>Example</small>
  <pre><code>${escapeHtml(code)}</code></pre>
</div>`;
}

function renderCodeChild(
  record: RecordRow,
  parent: NodeRow,
  child: NodeRow,
  childIndex: number,
): string {
  const mode = nodeMode(parent);
  const id = `child-${slugify(child.id)}`;
  const base = childClasses(child, childIndex, "project-command");
  const details = child.description ?? "";
  const example = renderCodeExample(child);

  if (mode === "collapse-list") {
    const panelId = uniquePanelId(record, parent, child);

    return `<div id="${attr(id)}" class="${attr(classes(base, "is-collapsible"))}">
  <div class="project-command-summary">${child.title ?? ""}</div>
  <button
    class="project-command-action collapse-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="${attr(panelId)}"
    aria-label="Expand ${attr(child.title || "item")}"
  ><span aria-hidden="true">⌄</span></button>
  <div id="${attr(panelId)}" class="project-command-panel" hidden>
    ${details}
    ${example}
  </div>
</div>`;
  }

  if (mode === "link-list") {
    const rawUrl = metaString(child, "url") || "#";
    const url = generatedEntryLink(record, rawUrl);

    return `<div id="${attr(id)}" class="${attr(base)}">
  <div class="project-command-content">
    ${childTitle(child)}
    ${details}
    ${example}
  </div>
  <a
    class="project-command-action"
    href="${attr(url)}"${externalAttributes(url)}
    aria-label="${attr(child.nav_label || child.title || "Open linked item")}"
  ><span aria-hidden="true">›</span></a>
</div>`;
  }

  return `<div id="${attr(id)}" class="${attr(base)}">
  ${childTitle(child)}
  ${details}
  ${example}
</div>`;
}

function renderCode(
  record: RecordRow,
  parent: NodeRow,
  children: NodeRow[],
  nodeIndex: number,
): string {
  const items = children
    .map((child, index) => renderCodeChild(record, parent, child, index))
    .join("\n");

  return `<section
  id="node-${attr(slugify(parent.id))}"
  class="${attr(parentClasses(parent, nodeIndex, "project-detail"))}"
>
  ${parentHeader(parent)}
  ${parentBody(parent)}
  <div class="project-command-list">
${items}
  </div>
</section>`;
}'''
          generator = replace_section(
              generator,
              code_marker,
              dispatch_marker,
              code_section,
              "generator code renderer",
          )

          dispatch_section = r'''/* =========================================================
   PARENT DISPATCH
   ========================================================= */

function renderParent(
  record: RecordRow,
  parent: NodeRow,
  nodes: NodeRow[],
  nodeIndex: number,
): string {
  const children = childrenOf(nodes, parent.id);

  switch (normalizedNodeType(parent)) {
    case "nav":
      return renderNav(record, parent, children, nodeIndex);

    case "display":
      return renderDisplay(parent, nodeIndex);

    case "grid":
      return renderGrid(parent, children, nodeIndex);

    case "split":
      return renderSplit(record, parent, children, nodeIndex);

    case "code":
      return renderCode(record, parent, children, nodeIndex);

    case "standard":
    default:
      return renderStandard(record, parent, children, nodeIndex);
  }
}'''
          generator = replace_section(
              generator,
              dispatch_marker,
              entry_content_marker,
              dispatch_section,
              "generator parent dispatch",
          )

          generator = replace_count(
              generator,
              '.map((parent) => renderParent(record, parent, nodes))',
              '.map((parent) =>\n        renderParent(record, parent, nodes, parents.indexOf(parent)),\n      )',
              3,
              "generator parent indexes",
          )

          generator = replace_once(
              generator,
              '    ENTRY_IDENTITY: renderEntryIdentity(record),',
              '    ENTRY_IDENTITY: `<div id="preview" class="preview">\\n${renderEntryIdentity(record)}`,',
              "generator preview wrapper open",
          )

          generator = replace_once(
              generator,
              '    ENTRY_CONTENT: renderEntryContent(record),',
              '    ENTRY_CONTENT: `${renderEntryContent(record)}\\n</div>`,',
              "generator preview wrapper close",
          )

          generator_path.write_text(generator, encoding="utf8")
          PY

      - name: Install TypeScript dependencies
        run: npm install --ignore-scripts

      - name: Type-check only
        run: npx tsc --noEmit

      - name: Commit renderer corrections and remove this one-time workflow
        shell: bash
        run: |
          rm .github/workflows/renderer-sync-once.yml
          git config user.name "OpenAI Renderer Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/local-editor/client.ts src/generator/generate.ts .github/workflows/renderer-sync-once.yml
          git commit -m "Synchronize editor and generator renderers"
          git push origin HEAD:main
