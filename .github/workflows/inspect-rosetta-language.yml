name: Inspect Rosetta language wording

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-rosetta-language.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Rosetta text fields excluding protected nodes
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          conn = sqlite3.connect('data/sandbox.db')
          conn.row_factory = sqlite3.Row

          protected = set()
          roots = conn.execute("""
            SELECT cn.id
            FROM content_nodes cn
            JOIN records r ON r.id = cn.record_id
            WHERE r.type='rosetta-stone'
              AND instr(lower(' ' || coalesce(cn.class_name,'') || ' '), ' rs-status ') > 0
          """).fetchall()
          protected.update(row['id'] for row in roots)

          changed = True
          while changed and protected:
            changed = False
            qs = ','.join('?' for _ in protected)
            children = conn.execute(
              f"SELECT id FROM content_nodes WHERE parent_id IN ({qs})",
              tuple(protected),
            ).fetchall()
            for row in children:
              if row['id'] not in protected:
                protected.add(row['id'])
                changed = True

          out = []
          out.append(f'PROTECTED_RS_STATUS_SUBTREE={len(protected)}')
          out.append('')

          record_fields = ('title','subtitle','description','nav_label','nav_group','notes')
          for rec in conn.execute("SELECT * FROM records WHERE type='rosetta-stone' ORDER BY title"):
            matches = []
            for field in record_fields:
              val = rec[field]
              if val and ('typescript' in str(val).lower() or 'current implementation' in str(val).lower()):
                matches.append((field, val))
            if matches:
              out.append(f"RECORD|{rec['id']}|{rec['title']}")
              for field,val in matches:
                out.append(f"  {field}={val}")
              out.append('')

          node_fields = ('title','subtitle','description','nav_label','content','metadata')
          rows = conn.execute("""
            SELECT cn.*
            FROM content_nodes cn
            JOIN records r ON r.id=cn.record_id
            WHERE r.type='rosetta-stone'
            ORDER BY cn.record_id, coalesce(cn.sort_order,999999), cn.id
          """).fetchall()

          for node in rows:
            if node['id'] in protected:
              continue
            matches = []
            for field in node_fields:
              if field == 'content' and (node['type'] or '').lower() in ('display','preview'):
                continue
              val = node[field]
              if val and ('typescript' in str(val).lower() or 'current implementation' in str(val).lower()):
                matches.append((field, val))
            if matches:
              out.append(f"NODE|{node['record_id']}|{node['id']}|type={node['type']}|title={node['title']}|class={node['class_name']}")
              for field,val in matches:
                out.append(f"  {field}={val}")
              out.append('')

          conn.close()
          Path('tmp-rosetta-language-report.txt').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-rosetta-language-report.txt
          git commit -m "Add temporary Rosetta language report"
          git push
