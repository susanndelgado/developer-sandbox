name: Restore CRUD preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-crud-preview.yml

permissions:
  contents: write

jobs:
  restore-crud-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original CRUD Display/Preview content
        run: |
          git show d14262a3401e026137c234a582377c71f92feb91:data/sandbox.db > /tmp/original-sandbox.db

          python3 - <<'PY'
          import sqlite3

          node_id = "node-rosetta-014-typescript-display"

          old = sqlite3.connect("/tmp/original-sandbox.db")
          old.row_factory = sqlite3.Row
          original = old.execute(
              "SELECT id, type, content FROM content_nodes WHERE id = ?",
              (node_id,),
          ).fetchone()
          old.close()

          if original is None:
              raise SystemExit("Original CRUD preview node was not found in baseline database.")

          if (original["type"] or "").lower() not in ("display", "preview"):
              raise SystemExit(f"Refusing restore: original node type is {original['type']!r}.")

          current = sqlite3.connect("data/sandbox.db")
          current.row_factory = sqlite3.Row
          now = current.execute(
              "SELECT id, type, content FROM content_nodes WHERE id = ?",
              (node_id,),
          ).fetchone()

          if now is None:
              current.close()
              raise SystemExit("Current CRUD preview node was not found.")

          if (now["type"] or "").lower() not in ("display", "preview"):
              current.close()
              raise SystemExit(f"Refusing restore: current node type is {now['type']!r}.")

          current.execute(
              "UPDATE content_nodes SET content = ? WHERE id = ?",
              (original["content"], node_id),
          )
          current.commit()

          restored = current.execute(
              "SELECT content FROM content_nodes WHERE id = ?",
              (node_id,),
          ).fetchone()[0]
          current.close()

          if restored != original["content"]:
              raise SystemExit("CRUD preview verification failed.")

          print("RESTORED CRUD PREVIEW CONTENT START")
          print(original["content"] or "")
          print("RESTORED CRUD PREVIEW CONTENT END")
          print("Only node-rosetta-014-typescript-display was updated.")
          PY

      - name: Commit restored database
        run: |
          if git diff --quiet -- data/sandbox.db; then
            echo "CRUD preview already matched the original content."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sandbox.db
          git commit -m "Restore original CRUD preview content"
          git push
