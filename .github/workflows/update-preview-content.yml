name: One-time preview content update

on:
  push:
    branches:
      - preview-content-update
    paths:
      - .github/workflows/update-preview-content.yml

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Update display and preview node content
        run: |
          python - <<'PY'
          import sqlite3

          db_path = "data/sandbox.db"
          replacement = '<img src="assets/img/comingSoon.png">'

          conn = sqlite3.connect(db_path)
          cur = conn.cursor()

          rows = cur.execute(
              "SELECT id, record_id, type, content FROM content_nodes WHERE type IN ('display', 'preview')"
          ).fetchall()

          if not rows:
              raise SystemExit("No display/preview content nodes were found; database was not changed.")

          cur.execute(
              "UPDATE content_nodes SET content = ? WHERE type IN ('display', 'preview')",
              (replacement,),
          )
          conn.commit()

          count = cur.execute(
              "SELECT COUNT(*) FROM content_nodes WHERE type IN ('display', 'preview') AND content = ?",
              (replacement,),
          ).fetchone()[0]

          total = len(rows)
          if count != total:
              raise SystemExit(f"Verification failed: expected {total} exact replacements, found {count}.")

          print(f"Updated and verified {count} display/preview nodes.")
          conn.close()
          PY

      - name: Commit database update and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/update-preview-content.yml
          git add data/sandbox.db
          git add -u .github/workflows/update-preview-content.yml
          git commit -m "Replace preview content with coming soon image"
          git push origin HEAD:preview-content-update
