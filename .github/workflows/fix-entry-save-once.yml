name: Fix Entry Save Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-entry-save-once.yml
      - scripts/fix-entry-save-once.py

permissions:
  contents: write

jobs:
  fix-entry-save:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply entry save fix
        run: python3 scripts/fix-entry-save-once.py

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Commit fix
        run: |
          rm .github/workflows/fix-entry-save-once.yml
          rm scripts/fix-entry-save-once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/local-editor/server.ts .github/workflows/fix-entry-save-once.yml scripts/fix-entry-save-once.py
          git commit -m "Fix entry save named parameters"
          git push origin HEAD:main
