name: Add preview placeholder triggers

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-preview-placeholder-triggers.yml

permissions:
  contents: write

jobs:
  add-triggers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add automatic blank preview placeholders
        run: |
          python3 - <<'PY'
          import sqlite3

          db_path = "data/sandbox.db"
          conn = sqlite3.connect(db_path)

          for trigger_name in (
              "content_nodes_blank_preview_after_insert",
              "content_nodes_blank_preview_after_update",
          ):
              conn.execute(f"DROP TRIGGER IF EXISTS {trigger_name}")

          placeholder_update = r'''
            UPDATE content_nodes
            SET content = printf(
              '<div class="preview-placeholder" role="img" aria-label="%s preview not yet available">\n  <span class="preview-placeholder-mark" aria-hidden="true">TS</span>\n  <span class="preview-placeholder-type">%s</span>\n  <strong class="preview-placeholder-title">%s</strong>\n  <span class="preview-placeholder-note">Preview coming soon</span>\n</div>',
              replace(replace(replace(replace(
                COALESCE((SELECT title FROM records WHERE id = NEW.record_id), ''),
                '&', '&amp;'), '<', '&lt;'), '>', '&gt;'), '"', '&quot;'),
              CASE (SELECT type FROM records WHERE id = NEW.record_id)
                WHEN 'rosetta-stone' THEN 'Rosetta Stone'
                WHEN 'lab-exploration' THEN 'LAB'
                WHEN 'general-project' THEN 'Project'
              END,
              replace(replace(replace(
                COALESCE((SELECT title FROM records WHERE id = NEW.record_id), ''),
                '&', '&amp;'), '<', '&lt;'), '>', '&gt;')
            )
            WHERE id = NEW.id
              AND EXISTS (
                SELECT 1
                FROM records
                WHERE id = NEW.record_id
                  AND type IN ('rosetta-stone', 'lab-exploration', 'general-project')
              );
          '''

          conn.executescript(f'''
            CREATE TRIGGER content_nodes_blank_preview_after_insert
            AFTER INSERT ON content_nodes
            WHEN lower(COALESCE(NEW.type, '')) IN ('display', 'preview')
             AND trim(COALESCE(NEW.content, '')) = ''
             AND EXISTS (
               SELECT 1 FROM records
               WHERE id = NEW.record_id
                 AND type IN ('rosetta-stone', 'lab-exploration', 'general-project')
             )
            BEGIN
              {placeholder_update}
            END;

            CREATE TRIGGER content_nodes_blank_preview_after_update
            AFTER UPDATE OF type, content, record_id ON content_nodes
            WHEN lower(COALESCE(NEW.type, '')) IN ('display', 'preview')
             AND trim(COALESCE(NEW.content, '')) = ''
             AND EXISTS (
               SELECT 1 FROM records
               WHERE id = NEW.record_id
                 AND type IN ('rosetta-stone', 'lab-exploration', 'general-project')
             )
            BEGIN
              {placeholder_update}
            END;
          ''')

          conn.commit()

          # Verify both triggers exist.
          triggers = {
              row[0]
              for row in conn.execute(
                  "SELECT name FROM sqlite_master WHERE type='trigger' AND name LIKE 'content_nodes_blank_preview_after_%'"
              )
          }
          expected = {
              "content_nodes_blank_preview_after_insert",
              "content_nodes_blank_preview_after_update",
          }
          if triggers != expected:
              raise SystemExit(f"Trigger verification failed: {triggers}")

          # Test the insert trigger without leaving a test row behind.
          test_record = conn.execute(
              "SELECT id, title, type FROM records WHERE type='rosetta-stone' ORDER BY id LIMIT 1"
          ).fetchone()
          if test_record is None:
              raise SystemExit("No Rosetta Stone record available for trigger test.")

          conn.execute("BEGIN")
          conn.execute(
              """
              INSERT INTO content_nodes (
                id, record_id, type, parent_id, title, subtitle, description,
                nav_label, content, sort_order, featured, hidden, class_name, metadata
              ) VALUES (?, ?, 'display', NULL, NULL, NULL, NULL, NULL, NULL, 999999, 0, 0, NULL, '{}')
              """,
              ("__preview_trigger_test__", test_record[0]),
          )
          generated = conn.execute(
              "SELECT content FROM content_nodes WHERE id='__preview_trigger_test__'"
          ).fetchone()[0]
          conn.execute("ROLLBACK")

          if not generated or 'preview-placeholder' not in generated:
              raise SystemExit("Insert trigger did not generate placeholder content.")
          if '<span class="preview-placeholder-type">Rosetta Stone</span>' not in generated:
              raise SystemExit("Generated Rosetta classification is incorrect.")
          if f'<strong class="preview-placeholder-title">{test_record[1]}</strong>' not in generated:
              raise SystemExit("Generated title is incorrect.")

          conn.close()
          print("Automatic preview placeholder triggers installed and verified.")
          print("They apply only to blank Display/Preview nodes for Rosetta Stones, Labs, and General Projects.")
          print("Existing nonblank preview content and Reference Guide/documentation records are untouched.")
          PY

      - name: Commit database trigger changes
        run: |
          if git diff --quiet -- data/sandbox.db; then
            echo "No database changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sandbox.db
          git commit -m "Auto-fill blank project preview nodes"
          git push
